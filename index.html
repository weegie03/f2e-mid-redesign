<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purina Cat Breeds - Redesign</title>

    <!-- Google Fonts: Nunito & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Nunito:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- 引入 Bootstrap Icons 圖示庫 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* 1. 嚴格色彩系統（3種色相）：主色木棕、輔助綠、米白/碳灰中性底 */
        :root {
            --primary-color: #C68B59;
            /* 貓抓板暖木棕 */
            --secondary-color: #5B8266;
            /* 鼠尾草綠 */
            --bg-color: #FBF9F5;
            /* 溫潤米白底 */
            --text-color: #2B2D42;
            /* 內文深碳灰 */
        }

        /* 2. 嚴格字型與字級（3種尺寸：32px, 20px, 16px） */
        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            /* 字級 1：內文 16px */
            line-height: 1.6;
        }

        h1,
        .hero-title {
            font-size: 32px;
            /* 字級 2：大標題 32px */
            font-weight: 700;
        }

        h2,
        .card-title {
            font-size: 20px;
            /* 字級 3：卡片/區塊標題 20px */
            font-weight: 700;
        }

        /* 主題樣式設定 */
        .btn-primary-custom {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
        }

        .btn-primary-custom:hover {
            background-color: #A86E3D;
            color: #fff;
        }

        .badge-custom {
            background-color: var(--secondary-color);
            color: #fff;
        }

        .cat-card img {
            height: 220px;
            object-fit: cover;
        }
        html {
            scroll-behavior: smooth; /* 平滑滾動 */
        }
    </style>
</head>

<body>

    <!-- 1. 頂部導覽列 Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#top" style="color: var(--primary-color);">にゃにこれ? 喵的什麼?</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#top">首頁</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">貓咪百科</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">新手指南</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 2. Hero 搜尋區塊 -->
    <header class="py-5 text-center">
        <div class="container">
            <h1 class="hero-title mb-3">你想知道喵的什麼!探索適合你的貓咪品種</h1>
            <p class="mb-4">輸入品種名稱或特性，快速查找貓咪照護知識與性格特質</p>

            <!-- 搜尋列 -->
            <div class="row justify-content-center">
                <div class="col-md-6 col-12">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" placeholder="例如：布偶貓、英國短毛貓...">
                        <button class="btn btn-primary-custom px-4" type="button">搜尋</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 3. 卡片列表區塊 -->
    <main class="container pb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>熱門品種圖鑑</h2>
            <span class="badge badge-custom rounded-pill px-3 py-2">共 42 種收錄</span>
        </div>

        <div class="row g-4">
            <!-- 貓咪卡片 1 -->
            <div class="col-12 col-md-4">
                <div class="card cat-card h-100 shadow-sm border-0 position-relative">
                    <img src="https://images.unsplash.com/photo-1697358120032-c07f0d450760?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                        class="card-img-top" style="object-position: 70% 50%;" alt="布偶貓">

                    <!-- 1. 這裡加了 d-flex flex-column，讓裡面的文字和按鈕可以自動推到底部 -->
                    <div class="card-body d-flex flex-column">

                        <!-- 2. 這一整行放了：左邊「標籤」＋ 右邊「愛心按鈕」 -->
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge badge-custom">長毛 / 溫馴</span>

                            <!-- 愛心按鈕與計數 -->
                            <button
                                class="btn btn-sm btn-link text-decoration-none p-0 d-flex align-items-center gap-1 like-btn"
                                data-count="128">
                                <i class="bi bi-heart text-danger"></i>
                                <span class="like-counter text-muted small">128</span>
                            </button>
                        </div>

                        <h2 class="card-title">布偶貓 (Ragdoll)</h2>
                        <p class="card-text text-muted">性格溫和親人，像玩偶一樣喜歡被人抱著，非常適合家庭陪伴。</p>

                        <!-- 3. 這裡的按鈕改成了 mt-auto，它會自動死死貼在卡片最底部對齊 -->
                        <a href="index_Ragdoll.html" class="btn btn-outline-secondary w-100 mt-auto">查看完整資料</a>
                    </div>
                </div>
            </div>
            <!-- 貓咪卡片 2 -->
            <div class="col-12 col-md-4">
                <div class="card cat-card h-100 shadow-sm border-0 position-relative">
                    <img src="https://images.unsplash.com/photo-1629624467541-f73ef8f12df2?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                        class="card-img-top" style="object-position: 30% 60%;" alt="英國短毛貓">

                    <div class="card-body d-flex flex-column">
                        <!-- 標籤與愛心按鈕並排 -->
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge badge-custom">短毛 / 安靜</span>

                            <!-- 愛心按鈕與計數（可自行微調 data-count 起始數字） -->
                            <button
                                class="btn btn-sm btn-link text-decoration-none p-0 d-flex align-items-center gap-1 like-btn"
                                data-count="96">
                                <i class="bi bi-heart text-danger"></i>
                                <span class="like-counter text-muted small">96</span>
                            </button>
                        </div>

                        <h2 class="card-title">英國短毛貓 (British Shorthair)</h2>
                        <p class="card-text text-muted">圓臉大眼，個性沉穩獨立，不黏人但喜歡安靜陪伴在身旁。</p>

                        <!-- 齊底按鈕 -->
                        <a href="#" class="btn btn-outline-secondary w-100 mt-auto">查看完整資料</a>
                    </div>
                </div>
            </div>

            <!-- 貓咪卡片 3 -->
            <div class="col-12 col-md-4">
                <div class="card cat-card h-100 shadow-sm border-0 position-relative">
                    <img src="https://images.unsplash.com/photo-1588823668292-6dfc53f91140?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                        class="card-img-top" style="object-position: 50% 30%;" alt="暹羅貓">

                    <div class="card-body d-flex flex-column">
                        <!-- 標籤與愛心按鈕並排 -->
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge badge-custom">短毛 / 活潑話多</span>

                            <!-- 愛心按鈕與計數（可自行微調 data-count 起始數字） -->
                            <button
                                class="btn btn-sm btn-link text-decoration-none p-0 d-flex align-items-center gap-1 like-btn"
                                data-count="142">
                                <i class="bi bi-heart text-danger"></i>
                                <span class="like-counter text-muted small">142</span>
                            </button>
                        </div>

                        <h2 class="card-title">暹羅貓 (Siamese)</h2>
                        <p class="card-text text-muted">智商極高、好奇心強且非常喜歡說話，需要飼主給予大量互動。</p>

                        <!-- 齊底按鈕 -->
                        <a href="#" class="btn btn-outline-secondary w-100 mt-auto">查看完整資料</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 貓咪愛心點擊互動腳本 -->
    <script>
        document.querySelectorAll('.like-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const icon = this.querySelector('i');
                const counter = this.querySelector('.like-counter');
                let count = parseInt(this.getAttribute('data-count'), 10);

                if (icon.classList.contains('bi-heart')) {
                    // 按下愛心：空心變實心紅、數字 + 1
                    icon.classList.remove('bi-heart');
                    icon.classList.add('bi-heart-fill');
                    count += 1;
                } else {
                    // 再次點擊：實心變回空心、數字 - 1
                    icon.classList.remove('bi-heart-fill');
                    icon.classList.add('bi-heart');
                    count -= 1;
                }

                this.setAttribute('data-count', count);
                counter.textContent = count;
            });
        });
    </script>
</body>

</html>
