<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purina Cat Breeds - Redesign</title>
  
  <!-- Google Fonts: Nunito & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* 1. 嚴格色彩系統（3種色相）：主色木棕、輔助綠、米白/碳灰中性底 */
    :root {
      --primary-color: #C68B59;      /* 貓抓板暖木棕 */
      --secondary-color: #5B8266;    /* 鼠尾草綠 */
      --bg-color: #FBF9F5;           /* 溫潤米白底 */
      --text-color: #2B2D42;         /* 內文深碳灰 */
    }

    /* 2. 嚴格字型與字級（3種尺寸：32px, 20px, 16px） */
    body {
      font-family: 'Nunito', 'Noto Sans TC', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 16px;              /* 字級 1：內文 16px */
      line-height: 1.6;
    }

    h1, .hero-title {
      font-size: 32px;              /* 字級 2：大標題 32px */
      font-weight: 700;
    }

    h2, .card-title {
      font-size: 20px;              /* 字級 3：卡片/區塊標題 20px */
      font-weight: 700;
    }

    /* 主題樣式設定 */
    .btn-primary-custom {
      background-color: var(--primary-color);
      color: #fff;
      border: none;
    }
    .btn-primary-custom:hover {
      background-color: #A86E3D;
      color: #fff;
    }

    .badge-custom {
      background-color: var(--secondary-color);
      color: #fff;
    }

    .cat-card img {
      height: 220px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- 1. 頂部導覽列 Navbar -->
  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#" style="color: var(--primary-color);">Purina CatDex</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">首頁</a></li>
          <li class="nav-item"><a class="nav-link" href="#">貓咪百科</a></li>
          <li class="nav-item"><a class="nav-link" href="#">新手指南</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 2. Hero 搜尋區塊 -->
  <header class="py-5 text-center">
    <div class="container">
      <h1 class="hero-title mb-3">探索適合你的貓咪品種</h1>
      <p class="mb-4">輸入品種名稱或特性，快速查找貓咪照護知識與性格特質</p>
      
      <!-- 搜尋列 -->
      <div class="row justify-content-center">
        <div class="col-md-6 col-12">
          <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="例如：布偶貓、英國短毛貓...">
            <button class="btn btn-primary-custom px-4" type="button">搜尋</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 3. 卡片列表區塊 -->
  <main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>熱門品種圖鑑</h2>
      <span class="badge badge-custom rounded-pill px-3 py-2">共 42 種收錄</span>
    </div>

    <div class="row g-4">
      <!-- 貓咪卡片 1 -->
      <div class="col-12 col-md-4">
        <div class="card cat-card h-100 shadow-sm border-0">
          <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600" class="card-img-top" alt="布偶貓">
          <div class="card-body">
            <span class="badge badge-custom mb-2">長毛 / 溫馴</span>
            <h2 class="card-title">布偶貓 (Ragdoll)</h2>
            <p class="card-text text-muted">性格溫和親人，像玩偶一樣喜歡被人抱著，非常適合家庭陪伴。</p>
            <a href="index_Ragdoll.html" class="btn btn-outline-secondary w-100 mt-2">查看完整資料</a>
          </div>
        </div>
      </div>

      <!-- 貓咪卡片 2 -->
      <div class="col-12 col-md-4">
        <div class="card cat-card h-100 shadow-sm border-0">
          <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=600" class="card-img-top" alt="英國短毛貓">
          <div class="card-body">
            <span class="badge badge-custom mb-2">短毛 / 安靜</span>
            <h2 class="card-title">英國短毛貓 (British Shorthair)</h2>
            <p class="card-text text-muted">圓臉大眼，個性沉穩獨立，不黏人但喜歡安靜陪伴在身旁。</p>
            <a href="#" class="btn btn-outline-secondary w-100 mt-2">查看完整資料</a>
          </div>
        </div>
      </div>

      <!-- 貓咪卡片 3 -->
      <div class="col-12 col-md-4">
        <div class="card cat-card h-100 shadow-sm border-0">
          <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=600" class="card-img-top" alt="暹羅貓">
          <div class="card-body">
            <span class="badge badge-custom mb-2">短毛 / 活潑話多</span>
            <h2 class="card-title">暹羅貓 (Siamese)</h2>
            <p class="card-text text-muted">智商極高、好奇心強且非常喜歡說話，需要飼主給予大量互動。</p>
            <a href="#" class="btn btn-outline-secondary w-100 mt-2">查看完整資料</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
